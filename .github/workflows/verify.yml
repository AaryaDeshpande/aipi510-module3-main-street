name: Verify pipeline and Docker serving

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-train.txt
            requirements-dev.txt
      - name: Record this run and install the pinned environment
        run: |
          set -euo pipefail
          mkdir -p reports/ci container-artifacts
          python - <<'PY'
          import json, os, platform, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          record = {
              'checked_utc': datetime.now(timezone.utc).isoformat(),
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'python': platform.python_version(),
              'scope': 'Frozen local dataset; Docker training and serving; cloud ingestion and public deployment are separate checks'
          }
          Path('reports/ci/run.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          python -m pip install -r requirements-dev.txt 2>&1 | tee reports/ci/install.log
          python -m pip check 2>&1 | tee reports/ci/pip-check.log
      - name: Run data, evaluation, API, and financial snapshot tests
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee reports/ci/pytest.log
      - name: Build the actual Docker image
        run: |
          set -euo pipefail
          docker build --tag main-street-ci . 2>&1 | tee reports/ci/docker-build.log
          docker image inspect main-street-ci > reports/ci/docker-image.json
      - name: Train inside the container
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD/container-artifacts:/output" \
            main-street-ci train --data-uri data/panel.csv --output-dir /output \
            2>&1 | tee reports/ci/docker-train.log
      - name: Compare container training with the recorded experiment
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path
          import numpy as np
          import pandas as pd
          before = Path('artifacts')
          after = Path('container-artifacts')
          expected = json.loads((before / 'metadata.json').read_text())
          actual = json.loads((after / 'metadata.json').read_text())
          checks = {
              'same_dataset_sha256': expected['dataset']['sha256'] == actual['dataset']['sha256'],
              'local_snapshot_transport': actual['dataset']['transport'] == 'local',
              'same_selected_alpha': expected['alpha'] == actual['alpha'],
              'same_split_counts': expected['split_counts'] == actual['split_counts'],
              'same_split_ids': json.loads((before / 'split_ids.json').read_text()) == json.loads((after / 'split_ids.json').read_text()),
              'same_baseline_conclusion': expected['model_beats_baseline'] == actual['model_beats_baseline'],
          }
          for group in ['validation', 'baseline_validation', 'test', 'baseline_test']:
              checks['same_' + group] = all(
                  math.isclose(expected[group][key], actual[group][key], rel_tol=1e-10, abs_tol=1e-10)
                  for key in expected[group]
              )
          old = pd.read_csv(before / 'test_predictions.csv', dtype={'county_fips': str, 'industry': str})
          new = pd.read_csv(after / 'test_predictions.csv', dtype={'county_fips': str, 'industry': str})
          checks['same_prediction_schema'] = old.columns.tolist() == new.columns.tolist()
          checks['same_prediction_rows'] = old.shape == new.shape
          checks['same_predictions'] = bool(checks['same_prediction_schema'] and checks['same_prediction_rows'])
          if checks['same_predictions']:
              for key in old.columns:
                  if pd.api.types.is_numeric_dtype(old[key]):
                      checks['same_predictions'] &= bool(np.allclose(old[key], new[key], rtol=1e-10, atol=1e-10, equal_nan=True))
                  else:
                      checks['same_predictions'] &= old[key].equals(new[key])
          result = {'passed': all(checks.values()), 'checks': checks, 'scope': 'Container retraining of the frozen local snapshot'}
          Path('reports/ci/container-reproduction.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          if not result['passed']:
              raise SystemExit('Container reproduction failed')
          PY
      - name: Serve the container-trained model and check real HTTP
        run: |
          set -euo pipefail
          docker run --detach --name main-street-ci-api \
            --publish 8080:8080 \
            --volume "$PWD/container-artifacts:/app/artifacts:ro" \
            main-street-ci
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health > reports/ci/health.json 2>/dev/null; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' main-street-ci-api)" != true ]; then
              docker logs main-street-ci-api
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs main-street-ci-api
            exit 1
          fi
          python scripts/http_smoke.py --base-url http://127.0.0.1:8080 --output reports/ci/http-smoke.json
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"industry":"2382","establishments":100,"previous_establishments":95}' \
            http://127.0.0.1:8080/predict > reports/ci/curl-prediction.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('container-artifacts/metadata.json').read_text())
          health = json.loads(Path('reports/ci/health.json').read_text())
          prediction = json.loads(Path('reports/ci/curl-prediction.json').read_text())
          assert health['model_sha256'] == prediction['model_sha256'] == metadata['model_sha256']
          assert health['dataset_sha256'] == metadata['dataset']['sha256']
          assert prediction['target_year'] == metadata['forecast_year']
          PY
      - name: Collect container logs and stop the service
        if: always()
        run: |
          mkdir -p reports/ci
          if docker container inspect main-street-ci-api >/dev/null 2>&1; then
            docker logs main-street-ci-api > reports/ci/docker-serve.log 2>&1
            docker rm --force main-street-ci-api
          fi
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-docker-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            reports/ci/
            container-artifacts/metadata.json
            container-artifacts/ingestion.json
            container-artifacts/resolved_config.json
            container-artifacts/split_ids.json
            container-artifacts/test_predictions.csv
